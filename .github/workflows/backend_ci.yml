name: Backend CI

# Integración continua: ejecuta la suite de pruebas del backend en cada push
# y pull request a las ramas principales. Asegura que ningún cambio rompa
# las pruebas (buenas prácticas / calidad — Evaluación 3).

on:
  push:
    branches: [main, develop, feature/**]
    paths:
      - 'Producto/backend/**'
      - '.github/workflows/backend_ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Producto/backend/**'
  workflow_dispatch:

jobs:
  test:
    name: pytest (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Producto/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite de pruebas
        run: pytest tests/ -v
