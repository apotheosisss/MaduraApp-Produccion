name: Keep Backend Alive

on:
  schedule:
    - cron: '*/14 * * * *'   # cada 14 minutos (Render duerme a los 15)
  workflow_dispatch:

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    continue-on-error: true   # no enviar notificaciones de fallo
    steps:
      - name: Ping /v1/health
        run: |
          if [ -z "${{ secrets.RENDER_URL }}" ]; then
            echo "RENDER_URL secret no configurado — omitiendo ping"
            exit 0
          fi
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_URL }}/v1/health" \
            --max-time 30 || echo "000")
          echo "HTTP status: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "Backend activo"
          else
            echo "Backend no responde (status $RESPONSE)"
          fi
